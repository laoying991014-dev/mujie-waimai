name: Fix merchant create payment fields

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add missing create form fields
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('client/src/pages/admin/AdminMerchantsPage/AdminMerchantsPage.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = r"(const openCreateDialog = \(\): void => \{.*?contactPhone: '',)(\n)(\s+address: '',)"
          replacement = r"\1\2      paymentRecipientName: '',\n      paymentPhone: '',\3"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count == 0:
              raise SystemExit('openCreateDialog payment fields already fixed or pattern not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/admin/AdminMerchantsPage/AdminMerchantsPage.tsx
          git rm .github/workflows/fix-merchant-create-form.yml
          git commit -m 'fix: add merchant create payment fields' || exit 0
          git push
