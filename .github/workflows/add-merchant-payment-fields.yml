name: Add merchant payment fields

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update merchant admin form
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/pages/admin/AdminMerchantsPage/AdminMerchantsPage.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {old[:100]}')
              text = text.replace(old, new, 1)

          replace_once(
              "  contactPhone: string;\n  address: string;",
              "  contactPhone: string;\n  paymentRecipientName: string;\n  paymentPhone: string;\n  address: string;",
          )

          # Add payment fields to both the initial state and the create-dialog reset state.
          old_state = "    contactPhone: '',\n    address: '',"
          new_state = "    contactPhone: '',\n    paymentRecipientName: '',\n    paymentPhone: '',\n    address: '',"
          if text.count(old_state) < 2:
              raise SystemExit('Expected two form state blocks')
          text = text.replace(old_state, new_state, 2)

          replace_once(
              "      contactPhone: merchant.contactPhone,\n      address: '',",
              "      contactPhone: merchant.contactPhone,\n      paymentRecipientName: merchant.paymentRecipientName || '',\n      paymentPhone: merchant.paymentPhone || '',\n      address: '',",
          )

          replace_once(
              "          contactPhone: formData.contactPhone,\n          address: formData.address,",
              "          contactPhone: formData.contactPhone,\n          paymentRecipientName: formData.paymentRecipientName,\n          paymentPhone: formData.paymentPhone,\n          address: formData.address,",
          )

          replace_once(
              "          contactPhone: formData.contactPhone,\n          address: formData.address,\n          categoryId: formData.categoryId,",
              "          contactPhone: formData.contactPhone,\n          paymentRecipientName: formData.paymentRecipientName,\n          paymentPhone: formData.paymentPhone,\n          address: formData.address,\n          categoryId: formData.categoryId,",
          )

          replace_once(
              "            <div className=\"space-y-2\">\n              <label className=\"text-sm font-medium\">地址</label>",
              "            <div className=\"grid grid-cols-2 gap-3\">\n              <div className=\"space-y-2\">\n                <label className=\"text-sm font-medium\">收款人姓名</label>\n                <Input\n                  value={formData.paymentRecipientName}\n                  onChange={(e) =>\n                    setFormData({ ...formData, paymentRecipientName: e.target.value })\n                  }\n                  placeholder=\"请输入收款人姓名\"\n                />\n              </div>\n              <div className=\"space-y-2\">\n                <label className=\"text-sm font-medium\">收款人手机号</label>\n                <Input\n                  value={formData.paymentPhone}\n                  onChange={(e) =>\n                    setFormData({ ...formData, paymentPhone: e.target.value })\n                  }\n                  placeholder=\"请输入收款人手机号\"\n                />\n              </div>\n            </div>\n            <div className=\"space-y-2\">\n              <label className=\"text-sm font-medium\">地址</label>",
          )

          path.write_text(text, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/admin/AdminMerchantsPage/AdminMerchantsPage.tsx
          git rm .github/workflows/add-merchant-payment-fields.yml
          git commit -m 'feat: add merchant payment recipient fields to admin form' || exit 0
          git push
