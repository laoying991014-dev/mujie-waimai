name: Finish merchant payment fields

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finish merchant form
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/pages/admin/AdminMerchantsPage/AdminMerchantsPage.tsx')
          text = path.read_text(encoding='utf-8')

          old = "    contactPhone: '',\n    address: '',"
          new = "    contactPhone: '',\n    paymentRecipientName: '',\n    paymentPhone: '',\n    address: '',"
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/admin/AdminMerchantsPage/AdminMerchantsPage.tsx
          git rm .github/workflows/add-merchant-payment-fields.yml
          git commit -m 'fix: finish merchant payment form state' || exit 0
          git push
