name: Sync payment recipient to frontend

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch payment recipient fields
        shell: python
        run: |
          from pathlib import Path

          service = Path('server/modules/order/order.service.ts')
          text = service.read_text(encoding='utf-8')
          old = "SELECT payment_phone, payment_qr_url FROM payment_setting ORDER BY created_at ASC LIMIT 1"
          new = "SELECT payment_recipient_name, payment_phone, payment_qr_url FROM payment_setting ORDER BY created_at ASC LIMIT 1"
          if old not in text:
              raise SystemExit('order.service.ts: payment settings query not found')
          text = text.replace(old, new, 1)
          old_return = "paymentPhone: s?.payment_phone || '', paymentQrUrl: s?.payment_qr_url || '', paymentLast5:"
          new_return = "paymentRecipientName: s?.payment_recipient_name || '', paymentPhone: s?.payment_phone || '', paymentQrUrl: s?.payment_qr_url || '', paymentLast5:"
          if old_return not in text:
              raise SystemExit('order.service.ts: payment return block not found')
          text = text.replace(old_return, new_return, 1)
          service.write_text(text, encoding='utf-8')

          api = Path('client/src/api/order.ts')
          text = api.read_text(encoding='utf-8')
          old = "  status: string;\n  paymentPhone: string;"
          new = "  status: string;\n  paymentRecipientName: string;\n  paymentPhone: string;"
          if old not in text:
              raise SystemExit('order.ts: PaymentInfo block not found')
          text = text.replace(old, new, 1)
          api.write_text(text, encoding='utf-8')

          page = Path('client/src/pages/PaymentPage/PaymentPage.tsx')
          text = page.read_text(encoding='utf-8')
          old = '<div className="font-semibold mb-3">收款人姓名</div>\n            <div className="w-full rounded-lg border px-4 py-3 text-lg font-medium">收款人</div>'
          new = '<div className="font-semibold mb-3">收款人姓名</div>\n            <div className="w-full rounded-lg border px-4 py-3 text-lg font-medium">{info.paymentRecipientName || \'暂未设置\'}</div>'
          if old not in text:
              raise SystemExit('PaymentPage.tsx: recipient display block not found')
          text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')

      - name: Commit final fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/modules/order/order.service.ts client/src/api/order.ts client/src/pages/PaymentPage/PaymentPage.tsx
          git commit -m 'fix: sync payment recipient name and phone to customer payment page'
          git push

      - name: Remove workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-payment-recipient.yml
          git commit -m 'chore: remove temporary payment sync workflow'
          git push
